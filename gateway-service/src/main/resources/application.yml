server:
  port: 8888

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:http://localhost:9999"

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
